<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Terigo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #16181d;
      --muted: #9ca3af;
      --text: #f5f5f5;
      --accent: #ff7a1a;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }
    .card {
      background: var(--panel);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1, h2 {
      margin: 0 0 12px;
    }
    p, li {
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    ul {
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Terigo</h1>
      <p>Route planning, route tracking, saved-route organization, sharing, offline map support, and activity import built for iPhone.</p>
    </section>

    <section class="card">
      <h2>App Links</h2>
      <ul>
        <li><a href="./support.html">Support</a></li>
        <li><a href="./privacy.html">Privacy Policy</a></li>
      </ul>
    </section>

    <section class="card">
      <h2>Shared Lists</h2>
      <p>The public browser fallback for Terigo shared lists lives under <code>/lists/shared</code>.</p>
    </section>
  </main>
</body>
</html>
