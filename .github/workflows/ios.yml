name: iOS simulator validation

on:
  push:
    branches: [main, 'astra/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Identify Xcode
        id: xcode
        run: echo "key=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore simulator build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/DerivedData
          key: terigo-${{ runner.os }}-${{ steps.xcode.outputs.key }}-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
          restore-keys: terigo-${{ runner.os }}-${{ steps.xcode.outputs.key }}-${{ hashFiles('**/Package.resolved') }}-
      - name: Build the native simulator app
        id: build
        run: python3 Scripts/validate_ios.py build
      - name: Run feature tests and the visual tour
        run: python3 Scripts/validate_ios.py test
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/Terigo.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Terigo.xcresult --output-path build/screenshots
            xcrun xcresulttool get test-results summary --path build/Terigo.xcresult > build/test-summary.json
          fi
      - name: Save simulator build cache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/DerivedData
          key: terigo-${{ runner.os }}-${{ steps.xcode.outputs.key }}-${{ hashFiles('**/Package.resolved') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terigo-simulator-evidence
          path: |
            build/screenshots/
            build/test-summary.json
            build/validation.json
            build/xcodebuild.log
          retention-days: 7
