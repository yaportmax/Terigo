name: Feature request
description: Suggest a focused improvement to Terigo.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Does this change data handling?
      options:
        - "No"
        - "Yes, local data only"
        - "Yes, network or hosted data"
        - "Unsure"
    validations:
      required: true
